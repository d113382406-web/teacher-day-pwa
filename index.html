<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教師節快樂!</title>
<style>

* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}
.card {
background-color: #ffffff;
border-radius: 20px;
padding: 40px 30px;
box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
text-align: center;
max-width: 450px;
width: 100%;
transition: transform 0.3s ease;
}

.card:hover {
transform: translateY(-5px);
}
.icon {
font-size: 64px;
margin-bottom: 15px;
animation: bounce 2s infinite;
}
h1 {
color: #333333;
font-size: 28px;
margin-bottom: 15px;
}
p {
color: #666666;
font-size: 16px;
line-height: 1.6;
margin-bottom: 25px;
}
.btn {
background: linear-gradient(45deg, #ff758c, #ff7eb3);
color: white;
border: none;
padding: 12px 28px;

font-size: 16px;
font-weight: bold;
border-radius: 50px;
cursor: pointer;
box-shadow: 0 4px 12px rgba(255, 117, 140, 0.4);
transition: all 0.2s ease;
}
.btn:hover {
opacity: 0.9;
transform: scale(1.05);
}
.message {
margin-top: 20px;
font-size: 18px;
font-weight: bold;
color: #4a90e2;
min-height: 27px;
}

@keyframes bounce {
0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
40% { transform: translateY(-15px); }
60% { transform: translateY(-7px); }
}

</style>
</head>
<body>

<div class="card">
<div class="icon"> </div>
<h1>教師節快樂!</h1>
<p>感謝各位老師辛勤的教導與無私的奉獻,<br>祝您工作順利、桃李
滿天下!</p>

<button class="btn" onclick="showWish()">點擊領取祝福</button>
<div class="message" id="wishText"></div>
</div>

<script>
const wishes = [
" 願您教書育人的每一天,都充滿成就感!",
" 感謝您成為我們生命中的引路人!",
" 辛苦了!今天記得給自己來杯好喝的咖啡休息一下~",
" 祝您教師節快樂,平安健康,桃李滿天下!"
];

function showWish() {
const randomIndex = Math.floor(Math.random() * wishes.length);

document.getElementById("wishText").innerText =
wishes[randomIndex];
}
</script>

</body>
</html>
